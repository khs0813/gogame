services:
  - type: web
    name: baduk-ai-course
    runtime: static
    buildCommand: npm ci && npm test && npm run validate
    staticPublishPath: ./dist
    envVars:
      - key: SITE_URL
        value: https://baduk-ai-course.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
